# Dokploy "Docker Compose" service for the production-prod environment (Compose Path: ./docker-compose.prod.yml).
# Unlike docker-compose.yml it has no fixed container_name / host port and uses its own image tag,
# so it can run next to the production stack on the same Docker host. Route a domain to container port 8080.
# Env vars (APP_KEY, DB_*, JWT_SECRET, ...) are set in Dokploy → Environment,
# NOT in this repo. Required: APP_ENV, APP_KEY, APP_URL, DB_HOST, DB_PORT,
# DB_DATABASE, DB_USERNAME, DB_PASSWORD, JWT_SECRET (+ the marketplace/mail keys
# the current server .env has).
x-app: &app
  build:
    context: .
  image: ps-backend-prod:latest
  restart: unless-stopped
  env_file: []
  environment: &env
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: ${APP_KEY}
    APP_URL: ${APP_URL}
    DB_CONNECTION: mysql
    # Internal hostname of the Dokploy MariaDB service (shown on its page).
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    JWT_SECRET: ${JWT_SECRET}
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    # Must exceed the longest job timeout (GenerateBarcodePdfJob = 900s) or a slow PDF job gets re-queued mid-run.
    DB_QUEUE_RETRY_AFTER: 1000
    CACHE_STORE: database
    FILESYSTEM_DISK: local
    # Write storage/logs/laravel.log (read by /logs) and keep stderr for `docker logs`.
    LOG_CHANNEL: stack
    LOG_STACK: single,stderr
  networks:
    - dokploy-network
  volumes:
    - ps-backend-storage:/var/www/html/storage/app
    - ps-backend-logs:/var/www/html/storage/logs

services:
  ps-backend:
    <<: *app
    environment:
      <<: *env
      PHP_OPCACHE_ENABLE: "1"

  # Replaces the missing `queue:work` process (QUEUE_CONNECTION=database).
  ps-backend-queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true

  # Replaces the root crontab `schedule:run` every minute.
  ps-backend-scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    healthcheck:
      disable: true

volumes:
  ps-backend-storage:
  ps-backend-logs:

# Dokploy databases live on this network; joining it lets DB_HOST resolve.
networks:
  dokploy-network:
    external: true
